<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0c12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>StreamWall</title>
<style>
  :root {
    --bg: #0a0c12; --bg2: #0f121a; --panel: #151924; --panel2: #1c2130; --panel3: #242a3b;
    --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.12);
    --text: #eef1f7; --dim: #8b93a7; --dim2: #5d6478;
    --accent: #6d7cff; --accent2: #a46bff; --grad: linear-gradient(135deg, #6d7cff, #a46bff);
    --green: #34d399; --red: #ff5c6c; --amber: #ffb547;
    --twitch: #9146ff; --youtube: #ff3b3b; --file: #34d399; --hls: #38bdf8; --web: #8b93a7;
    --r: 16px; --r-sm: 11px;
    --shadow: 0 10px 30px -12px rgba(0,0,0,.6);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    color: var(--text); min-height: 100vh;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
    max-width: 600px; margin: 0 auto; padding: 0 16px calc(110px + env(safe-area-inset-bottom));
    user-select: none; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(700px 380px at 15% -10%, rgba(109,124,255,.16), transparent 70%),
      radial-gradient(600px 340px at 100% 0%, rgba(164,107,255,.10), transparent 70%),
      var(--bg);
    background-attachment: fixed;
  }
  button { font: inherit; color: inherit; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ---------- header ---------- */
  header.top {
    position: sticky; top: 0; z-index: 50; margin: 0 -16px; padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(to bottom, rgba(10,12,18,.94), rgba(10,12,18,.80));
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .logo { width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; box-shadow: 0 4px 14px -4px rgba(109,124,255,.6); }
  .brand { font-weight: 750; font-size: 18px; letter-spacing: -.02em; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 99px;
    font-size: 12px; font-weight: 650; background: var(--panel); border: 1px solid var(--line2); color: var(--dim);
  }
  .pill .d { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.on { color: var(--green); } .pill.on .d { box-shadow: 0 0 0 0 rgba(52,211,153,.6); animation: pulse 2s infinite; }
  .pill.warn { color: var(--amber); } .pill.off { color: var(--red); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.55); } 70% { box-shadow: 0 0 0 7px rgba(52,211,153,0); } 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); } }
  .hbtns { margin-left: auto; display: flex; gap: 6px; }
  .hbtn {
    width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line2); background: var(--panel);
    display: grid; place-items: center; cursor: pointer; color: var(--dim); transition: transform .12s, color .2s;
  }
  .hbtn:active { transform: scale(.92); }
  .hbtn:hover { color: var(--text); }

  /* sleep banner */
  #sleepBanner {
    display: none; margin-top: 12px; padding: 10px 12px; border-radius: var(--r-sm);
    background: rgba(164,107,255,.12); border: 1px solid rgba(164,107,255,.3); color: #d8c6ff;
    align-items: center; gap: 10px; font-size: 13px; font-weight: 600;
  }
  #sleepBanner.show { display: flex; }
  #sleepBanner button { margin-left: auto; background: rgba(255,255,255,.08); border: 0; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 650; }

  /* standby hero */
  #standbyHero {
    display: none; margin-top: 14px; padding: 22px 18px; border-radius: var(--r); text-align: center;
    background: var(--panel); border: 1px solid var(--line2);
  }
  #standbyHero.show { display: block; }
  #standbyHero h3 { font-size: 17px; margin-bottom: 4px; }
  #standbyHero p { color: var(--dim); font-size: 13px; margin-bottom: 14px; }
  #standbyHero button {
    border: 0; background: var(--grad); color: #fff; font-weight: 700; padding: 12px 22px; border-radius: 99px;
    display: inline-flex; gap: 8px; align-items: center; cursor: pointer; box-shadow: 0 8px 24px -8px rgba(109,124,255,.8);
  }

  /* ---------- sections ---------- */
  .sec { margin-top: 22px; }
  .sech {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px; cursor: pointer;
    font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); font-weight: 700;
  }
  .sech .cnt { background: var(--panel2); color: var(--dim); border-radius: 99px; padding: 1px 7px; font-size: 11px; letter-spacing: 0; }
  .sech svg.i { width: 15px; height: 15px; margin-left: auto; transition: transform .2s; }
  .sec.collapsed .sech svg.chev { transform: rotate(-90deg); }
  .sec.collapsed .secb { display: none; }
  .sech .sub { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--dim2); }

  /* layout picker */
  .layouts { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .lay {
    aspect-ratio: 16/10; background: var(--panel); border: 1.5px solid var(--line2);
    border-radius: 10px; display: grid; gap: 2px; padding: 5px; cursor: pointer; transition: all .18s;
  }
  .lay div { background: #343b4f; border-radius: 2px; transition: background .18s; }
  .lay:active { transform: scale(.94); }
  .lay.active { border-color: var(--accent); background: rgba(109,124,255,.10); box-shadow: 0 0 0 3px rgba(109,124,255,.15); }
  .lay.active div { background: var(--grad); }
  .l-single { grid-template: 1fr / 1fr; }
  .l-split-h { grid-template: 1fr / 1fr 1fr; }
  .l-split-v { grid-template: 1fr 1fr / 1fr; }
  .l-opt { grid-template: 1fr 1fr / 2fr 1fr; } .l-opt div:first-child { grid-row: 1/3; }
  .l-grid { grid-template: 1fr 1fr / 1fr 1fr; }
  .l-free { display: block; position: relative; }
  .l-free div { position: absolute; }
  .l-free div:first-child { left: 10%; top: 12%; width: 55%; height: 58%; }
  .l-free div:last-child { left: 42%; top: 42%; width: 48%; height: 46%; opacity: .8; }

  /* free-layout editor */
  #freeEditor {
    position: relative; width: 100%; aspect-ratio: 16/9; background: #05070b;
    border: 1px solid var(--line2); border-radius: var(--r); overflow: hidden; touch-action: none;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 10% 10%;
  }
  .fbox {
    position: absolute; background: rgba(109,124,255,.18); border: 1.5px solid var(--accent);
    border-radius: 8px; color: var(--text); font-weight: 800; font-size: 15px;
    display: flex; align-items: center; justify-content: center; touch-action: none; backdrop-filter: blur(2px);
  }
  .fbox.nosrc { opacity: .35; }
  .fbox .fh {
    position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px;
    background: var(--grad); border-radius: 9px 0 6px 0; cursor: nwse-resize;
  }

  /* ---------- screen cards ---------- */
  #slots { display: grid; gap: 10px; }
  #slots.layout-single { grid-template: 1fr / 1fr; }
  #slots.layout-split-h { grid-template: 1fr / 1fr 1fr; }
  #slots.layout-split-v { grid-template: 1fr 1fr / 1fr; }
  #slots.layout-one-plus-two { grid-template: 1fr 1fr / 1fr 1fr; }
  #slots.layout-one-plus-two .slotcard:first-child { grid-column: 1/3; }
  #slots.layout-grid, #slots.layout-free { grid-template: 1fr 1fr / 1fr 1fr; }
  #slots.dim { opacity: .45; filter: saturate(.5); }
  .slotcard {
    position: relative; background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r);
    padding: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; overflow: hidden;
    box-shadow: var(--shadow); transition: transform .12s, border-color .2s; min-height: 132px; isolation: isolate;
  }
  .slotcard:active { transform: scale(.985); }
  .slotcard::before { /* colored edge per source type */
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--kc, transparent);
  }
  .slotcard .bg {
    position: absolute; inset: 0; z-index: -1; background-size: cover; background-position: center; opacity: .28;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 85%); mask-image: linear-gradient(to bottom, #000 0%, transparent 85%);
  }
  .slotcard.empty { border-style: dashed; background: transparent; box-shadow: none; align-items: center; justify-content: center; text-align: center; color: var(--dim); }
  .slotcard.empty .plus { width: 38px; height: 38px; border-radius: 50%; background: var(--panel2); display: grid; place-items: center; margin-bottom: 4px; }
  .slotcard.audible { border-color: rgba(109,124,255,.45); }
  .ctop { display: flex; align-items: center; gap: 6px; }
  .num {
    width: 22px; height: 22px; border-radius: 7px; background: var(--panel3); font-size: 12px; font-weight: 800;
    display: grid; place-items: center; color: var(--dim);
  }
  .slotcard.audible .num { background: var(--grad); color: #fff; }
  .badge { font-size: 10.5px; font-weight: 750; letter-spacing: .04em; padding: 2px 7px; border-radius: 6px; background: color-mix(in srgb, var(--kc) 22%, transparent); color: var(--kc); }
  .livetag { font-size: 10px; font-weight: 800; color: #fff; background: var(--red); padding: 2px 6px; border-radius: 5px; letter-spacing: .05em; }
  .pausedtag { font-size: 10px; font-weight: 800; color: var(--amber); }
  .cname { font-size: 15px; font-weight: 700; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
  .csub { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -4px; }
  .volrow { display: flex; align-items: center; gap: 8px; }
  .volrow .vv { font-size: 11px; color: var(--dim); min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
  .mutebtn { background: none; border: 0; color: var(--dim); cursor: pointer; padding: 2px; display: grid; }
  .slotcard.audible .mutebtn { color: var(--accent); }
  input[type=range].vol {
    flex: 1; -webkit-appearance: none; appearance: none; height: 5px; border-radius: 3px; min-width: 40px;
    background: linear-gradient(90deg, var(--accent) var(--p, 0%), var(--panel3) var(--p, 0%)); outline: none; margin: 0;
  }
  input[type=range].vol::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 2px 6px rgba(0,0,0,.4); cursor: pointer; }
  input[type=range].vol::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 0; cursor: pointer; }
  select.qual {
    flex: 1; background: var(--panel2); color: var(--text); border: 1px solid var(--line2); border-radius: 8px;
    padding: 5px 8px; font: inherit; font-size: 12px; min-width: 0;
  }
  .crow { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: 4px; margin-top: auto; }
  .iconbtn {
    border: 1px solid var(--line); background: var(--panel2); color: var(--dim);
    border-radius: 10px; height: 32px; min-width: 0; display: grid; place-items: center; cursor: pointer;
    transition: transform .1s, color .15s, background .15s;
  }
  .iconbtn svg.i { width: 16px; height: 16px; }
  .iconbtn:active { transform: scale(.9); }
  .iconbtn.on { color: #fff; background: var(--accent); border-color: var(--accent); }
  .iconbtn.danger { color: var(--red); }

  /* ---------- bottom bar ---------- */
  #bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 60; max-width: 600px; margin: 0 auto;
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(10,12,18,.98), rgba(10,12,18,.88));
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: 52px 1fr 1fr 52px; gap: 8px;
  }
  #bar button {
    height: 50px; border-radius: 15px; border: 1px solid var(--line2); background: var(--panel);
    font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: transform .12s, background .2s;
  }
  #bar button:active { transform: scale(.95); }
  #bar button.primary { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 8px 22px -10px rgba(109,124,255,.9); }
  #bar button.warn { background: var(--red); border-color: var(--red); color: #fff; }
  #bar button.offpw { color: var(--red); }
  #bar button.sleeping { color: var(--accent2); border-color: rgba(164,107,255,.5); }

  /* ---------- sheet ---------- */
  #overlay { position: fixed; inset: 0; background: rgba(3,4,8,.6); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 90; }
  #overlay.show { opacity: 1; pointer-events: auto; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; max-width: 600px; margin: 0 auto;
    background: var(--bg2); border-radius: 22px 22px 0 0; border: 1px solid var(--line2); border-bottom: 0;
    transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.9,.25,1); max-height: 86vh;
    display: flex; flex-direction: column; box-shadow: 0 -20px 60px -20px rgba(0,0,0,.8);
  }
  #sheet.open { transform: translateY(0); }
  #sheet.dragging { transition: none; }
  #sheetHead { padding: 8px 16px 0; touch-action: none; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--panel3); margin: 0 auto 10px; }
  .shtitle { display: flex; align-items: center; gap: 10px; }
  .shtitle h3 { font-size: 18px; letter-spacing: -.01em; }
  .shtitle .close { margin-left: auto; }
  .swaprow { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--dim); }
  .swaprow button { border: 1px solid var(--line2); background: var(--panel); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 12px; font-weight: 700; display: inline-flex; gap: 4px; align-items: center; }
  .swaprow svg.i { width: 13px; height: 13px; }
  .tabs { display: flex; gap: 4px; margin: 12px 0 10px; background: var(--panel); padding: 4px; border-radius: 12px; overflow-x: auto; }
  .tabs button {
    flex: 1; padding: 8px 6px; border-radius: 9px; border: 0; white-space: nowrap;
    background: transparent; color: var(--dim); font-size: 13px; font-weight: 650; cursor: pointer;
  }
  .tabs button.active { background: var(--panel3); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .searchwrap { position: relative; margin-bottom: 10px; }
  .searchwrap svg.i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--dim); width: 16px; height: 16px; }
  .searchwrap input { padding-left: 36px !important; margin: 0 !important; }
  #sheetBody { overflow-y: auto; padding: 0 16px calc(20px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
  #sheetBody h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin: 14px 0 8px; font-weight: 700; }
  .item {
    display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 13px;
    background: var(--panel); border: 1px solid var(--line); margin-bottom: 7px; cursor: pointer; transition: transform .1s, background .15s;
  }
  .item:active { transform: scale(.985); background: var(--panel2); }
  .item.playing { border-color: rgba(109,124,255,.5); background: rgba(109,124,255,.08); }
  .item .t { flex: 1; min-width: 0; }
  .item .t b { display: block; font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .t small { color: var(--dim); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .item .acts { display: flex; gap: 2px; }
  .item .acts button { background: none; border: 0; color: var(--dim); padding: 7px; cursor: pointer; border-radius: 8px; display: grid; }
  .item .acts button.del { color: var(--red); }
  .ico {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center;
    font-size: 11px; font-weight: 850; letter-spacing: .02em; color: #fff; background: var(--kc);
  }
  .thumb { width: 72px; height: 40px; border-radius: 8px; flex-shrink: 0; background: var(--panel3) center/cover; position: relative; }
  .thumb::after { content: "LIVE"; position: absolute; left: 4px; bottom: 4px; font-size: 8.5px; font-weight: 850; background: var(--red); color: #fff; padding: 1px 4px; border-radius: 3px; }
  .k-twitch { --kc: var(--twitch); } .k-youtube { --kc: var(--youtube); } .k-file { --kc: var(--file); }
  .k-hls { --kc: var(--hls); } .k-web { --kc: var(--web); }
  .tagchips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .tagchips button { border: 1px solid var(--line2); background: var(--panel); color: var(--dim); border-radius: 99px; padding: 4px 11px; font-size: 12px; font-weight: 650; cursor: pointer; }
  .tagchips button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  details.add { margin-top: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 0 12px; }
  details.add summary { padding: 12px 0; font-weight: 700; font-size: 14px; cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: center; color: var(--accent); }
  details.add summary::-webkit-details-marker { display: none; }
  details.add[open] { padding-bottom: 12px; }
  .editform { background: var(--panel2); border-radius: 13px; padding: 10px; margin-bottom: 7px; border: 1px solid var(--accent); }
  .editform .rowb { display: flex; gap: 8px; }
  .editform .rowb .btn { margin: 0; }

  /* status / sleep sheets */
  .stat { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--panel); border-radius: 13px; margin-bottom: 7px; border: 1px solid var(--line); }
  .stat .lbl { flex: 1; font-size: 14px; font-weight: 600; }
  .stat .lbl small { display: block; color: var(--dim); font-weight: 400; font-size: 12px; margin-top: 2px; user-select: text; }
  .stat .val { font-size: 13px; color: var(--dim); font-weight: 650; text-align: right; }
  .ok { color: var(--green) !important; } .bad { color: var(--red) !important; } .meh { color: var(--amber) !important; }
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .chips button { padding: 16px 8px; border-radius: 14px; border: 1px solid var(--line2); background: var(--panel); font-weight: 750; font-size: 15px; cursor: pointer; }
  .chips button small { display: block; color: var(--dim); font-size: 11px; font-weight: 500; }
  .chips button:active { transform: scale(.95); }
  .bigsleep { text-align: center; padding: 18px 0 8px; }
  .bigsleep b { font-size: 40px; font-weight: 800; letter-spacing: -.03em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; font-variant-numeric: tabular-nums; }
  .bigsleep div { color: var(--dim); font-size: 13px; }

  /* ---------- forms ---------- */
  input[type=text], input[type=url], textarea {
    width: 100%; padding: 12px 13px; border-radius: 12px; border: 1px solid var(--line2);
    background: var(--bg); color: var(--text); font-size: 15px; margin-bottom: 8px;
    font-family: inherit; resize: vertical; outline: none; transition: border-color .15s, box-shadow .15s; user-select: text;
  }
  input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(109,124,255,.18); }
  .btn {
    width: 100%; padding: 13px; border-radius: 12px; border: 0; background: var(--grad);
    color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 8px;
    display: flex; gap: 8px; align-items: center; justify-content: center; transition: transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line2); }
  .btn.danger { background: rgba(255,92,108,.12); color: var(--red); border: 1px solid rgba(255,92,108,.3); }
  .btnrow { display: flex; gap: 8px; } .btnrow .btn { flex: 1; }
  .hint { color: var(--dim); font-size: 12px; margin: 4px 0 12px; line-height: 1.5; }
  .hint code { background: var(--panel2); padding: 1px 5px; border-radius: 5px; font-size: 11px; user-select: text; }
  .empty-list { color: var(--dim); font-size: 13px; text-align: center; padding: 22px 10px; }
  .spin { width: 18px; height: 18px; border: 2px solid var(--panel3); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; margin: 20px auto; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ---------- widgets editor ---------- */
  .addrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .addrow button {
    padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line2);
    background: var(--panel); color: var(--text); font-weight: 650; font-size: 12.5px; cursor: pointer;
  }
  .addrow button:active { transform: scale(.95); }
  .wcard { background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r); padding: 12px; margin-bottom: 8px; }
  .whead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
           color: var(--accent); font-size: 11px; letter-spacing: .1em; font-weight: 800; }
  .whead .del { background: none; border: 0; color: var(--red); cursor: pointer; padding: 2px 4px; display: grid; }
  .wbody { display: flex; gap: 10px; }
  .wfields { flex: 1; min-width: 0; }
  .wfields input, .wfields textarea { margin-bottom: 6px; padding: 9px 11px; font-size: 14px; }
  .pad {
    width: 112px; aspect-ratio: 16/9; background: var(--bg); border: 1px solid var(--line2);
    border-radius: 9px; position: relative; touch-action: none; flex-shrink: 0; align-self: flex-start;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 25% 25%;
  }
  .pad .dot {
    position: absolute; width: 16px; height: 16px; border-radius: 50%;
    background: var(--grad); box-shadow: 0 0 0 4px rgba(109,124,255,.25); transform: translate(-50%, -50%); pointer-events: none;
  }
  .padlbl { font-size: 10px; color: var(--dim); text-align: center; margin-top: 4px; }
  .scorerow { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .scorerow input { flex: 1; margin: 0 !important; }
  .scorerow .sbtn {
    width: 38px; height: 40px; border-radius: 10px; border: 1px solid var(--line2);
    background: var(--panel2); color: var(--text); font-size: 17px; cursor: pointer; flex-shrink: 0;
  }
  .scorerow .sval { min-width: 26px; text-align: center; font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; }

  /* presets */
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .preset {
    display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 13px;
    background: var(--panel); border: 1px solid var(--line2); cursor: pointer; transition: transform .1s;
  }
  .preset:active { transform: scale(.97); }
  .preset b { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preset .del { background: none; border: 0; color: var(--dim2); cursor: pointer; display: grid; padding: 2px; }
  .savep { display: flex; gap: 8px; }
  .savep input { flex: 1; margin: 0; }
  .savep button { padding: 0 18px; border-radius: 12px; border: 0; background: var(--grad); color: #fff; font-weight: 700; cursor: pointer; }

  /* toasts */
  #toasts { position: fixed; left: 0; right: 0; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
  .toast {
    pointer-events: auto; display: flex; align-items: center; gap: 12px; max-width: 560px; width: max-content;
    background: #f2f4fa; color: #10131b; padding: 11px 14px; border-radius: 13px; font-size: 14px; font-weight: 600;
    box-shadow: 0 12px 34px -10px rgba(0,0,0,.7); animation: tin .25s cubic-bezier(.2,.9,.25,1.2);
  }
  .toast.err { background: var(--red); color: #fff; }
  .toast button { background: none; border: 0; color: var(--accent); font-weight: 800; cursor: pointer; font-size: 14px; }
  .toast.out { opacity: 0; transform: translateY(8px); transition: all .2s; }
  @keyframes tin { from { opacity: 0; transform: translateY(14px) scale(.96); } }
</style>
</head>
<body>

<header class="top">
  <svg class="logo" viewBox="0 0 100 100"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d7cff"/><stop offset="1" stop-color="#a46bff"/></linearGradient></defs>
    <rect width="100" height="100" rx="24" fill="url(#lg)"/><rect x="18" y="22" width="38" height="56" rx="7" fill="#fff" opacity=".95"/>
    <rect x="61" y="22" width="21" height="26" rx="6" fill="#fff" opacity=".7"/><rect x="61" y="52" width="21" height="26" rx="6" fill="#fff" opacity=".5"/>
    <polygon points="31,40 31,60 46,50" fill="#7a74ff"/></svg>
  <span class="brand">StreamWall</span>
  <span class="pill off" id="pill"><span class="d"></span><span id="pillTxt">Connecting</span></span>
  <div class="hbtns">
    <button class="hbtn" id="identBtn" title="Show screen numbers on TV"></button>
    <button class="hbtn" id="statusBtn" title="System status"></button>
  </div>
</header>

<div id="sleepBanner"><span id="sleepTxt"></span><button id="sleepCancel">Cancel</button></div>
<div id="standbyHero">
  <h3>The wall is in standby</h3>
  <p>No streams are running — the server is idling. Your setup is saved.</p>
  <button id="wakeBtn"></button>
</div>

<section class="sec" data-sec="layout">
  <div class="sech"><span>Layout</span></div>
  <div class="secb">
    <div class="layouts" id="layouts">
      <div class="lay l-single" data-layout="single" title="Single"><div></div></div>
      <div class="lay l-split-h" data-layout="split-h" title="Side by side"><div></div><div></div></div>
      <div class="lay l-split-v" data-layout="split-v" title="Stacked"><div></div><div></div></div>
      <div class="lay l-opt" data-layout="one-plus-two" title="1 + 2"><div></div><div></div><div></div></div>
      <div class="lay l-grid" data-layout="grid" title="2 × 2"><div></div><div></div><div></div><div></div></div>
      <div class="lay l-free" data-layout="free" title="Free arrange"><div></div><div></div></div>
    </div>
    <div id="freeWrap" style="display:none;margin-top:12px">
      <div class="hint" style="margin:0 0 8px">Drag boxes to move · drag the corner to resize</div>
      <div id="freeEditor"></div>
    </div>
  </div>
</section>

<section class="sec" data-sec="screens">
  <div class="sech"><span>Screens</span><span class="sub">tap a screen to change what's on</span></div>
  <div class="secb"><div id="slots" class="layout-single"></div></div>
</section>

<section class="sec" data-sec="widgets">
  <div class="sech" data-toggle><span>Widgets</span><span class="cnt" id="wCount">0</span></div>
  <div class="secb">
    <div id="widgetList"></div>
    <div class="addrow">
      <button data-add="text">+ Text</button>
      <button data-add="score">+ Score</button>
      <button data-add="clock">+ Clock</button>
      <button data-add="custom">+ Custom</button>
      <button data-add="csplayer">+ CS Player</button>
      <button data-add="csplayerlive">+ CS Live</button>
      <button data-add="csteam">+ CS Team</button>
      <button data-add="csmatch">+ CS Match</button>
      <button data-add="pslive">+ PS Scoreboard</button>
      <button data-add="psticker">+ PS Upcoming</button>
      <button data-add="pstournament">+ PS Tournaments</button>
    </div>
  </div>
</section>

<section class="sec" data-sec="presets">
  <div class="sech" data-toggle><span>Presets</span><span class="cnt" id="pCount">0</span></div>
  <div class="secb">
    <div id="presetList"></div>
    <div class="savep">
      <input type="text" id="presetName" placeholder="Save current wall as… (e.g. Sports Sunday)">
      <button id="presetSave">Save</button>
    </div>
  </div>
</section>

<div id="bar">
  <button id="powerBtn" title="Power / standby"></button>
  <button id="playBtn" class="primary"></button>
  <button id="muteBtn"></button>
  <button id="sleepBtn" title="Sleep timer"></button>
</div>

<div id="toasts"></div>
<div id="overlay"></div>
<div id="sheet">
  <div id="sheetHead">
    <div class="grab"></div>
    <div class="shtitle"><h3 id="sheetTitle">Screen 1</h3><button class="hbtn close" id="sheetClose"></button></div>
    <div id="sheetExtra"></div>
  </div>
  <div id="sheetBody"></div>
</div>

<script>
// ======================================================================
//  helpers
// ======================================================================
const $ = s => document.querySelector(s);
const ICONS = {
  left: '<polyline points="15 18 9 12 15 6"/>',
  right: '<polyline points="9 18 15 12 9 6"/>',
  play: '<polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/>',
  pause: '<rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>',
  fit: '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>',
  solo: '<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>',
  reload: '<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  power: '<path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>',
  moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  vol: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>',
  volx: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>',
  gear: '<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
  search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  edit: '<path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',
  chev: '<polyline points="6 9 12 15 18 9"/>',
  swap: '<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'
};
const ic = (n, cls) => '<svg class="i ' + (cls || '') + '" viewBox="0 0 24 24">' + ICONS[n] + '</svg>';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const LS = {
  get(k, d) { try { const v = localStorage.getItem('sw.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sw.' + k, JSON.stringify(v)); } catch {} }
};
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms || 8); } catch {} }
function api(url, opts) {
  return fetch(url, opts).then(r => r.json().then(j => { if (!r.ok && j && j.error) throw new Error(j.error); return j; }));
}
function postJson(url, body, method) {
  return api(url, { method: method || 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
}
function ago(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  return Math.floor(s / 86400) + ' d ago';
}
function dur(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  return h ? h + 'h ' + String(m).padStart(2, '0') + 'm' : m + ' min';
}

// source classification
function srcKind(url) {
  url = String(url || '');
  if (/twitch\.tv\//i.test(url)) return 'twitch';
  if (/youtu\.?be/i.test(url)) return 'youtube';
  if (url.startsWith('/media/')) return 'file';
  if (/\.m3u8(\?|$)/i.test(url)) return 'hls';
  return 'web';
}
const KIND = { twitch: ['Twitch', 'TW'], youtube: ['YouTube', 'YT'], file: ['File', '▶'], hls: ['HLS', 'HLS'], web: ['Link', '↗'] };
function twitchLogin(url) { const m = String(url || '').match(/twitch\.tv\/(?!videos\/)(\w+)/i); return m ? m[1].toLowerCase() : null; }
function icoHtml(url) { const k = srcKind(url); return '<span class="ico k-' + k + '">' + KIND[k][1] + '</span>'; }

// toasts
function toast(msg, opts) {
  opts = opts || {};
  const t = document.createElement('div');
  t.className = 'toast' + (opts.err ? ' err' : '');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (opts.action ? '<button>' + esc(opts.action) + '</button>' : '');
  const kill = () => { t.classList.add('out'); setTimeout(() => t.remove(), 220); };
  if (opts.action) t.querySelector('button').addEventListener('click', () => { buzz(); opts.onAction(); kill(); });
  $('#toasts').appendChild(t);
  while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
  setTimeout(kill, opts.ms || (opts.action ? 5000 : 2200));
}

// ======================================================================
//  state + websocket
// ======================================================================
let state = null, ws = null, tvs = null, online = false;
let currentSlot = 0, currentTab = LS.get('tab', 'saved'), sheetMode = 'media', query = '', tagFilter = null;
let streams = [], library = [], recent = [], followed = { enabled: false, streams: [] };
const VISIBLE = { 'single': 1, 'split-h': 2, 'split-v': 2, 'one-plus-two': 3, 'grid': 4, 'free': 4 };
const lastVol = LS.get('lastVol', [100, 100, 100, 100]);

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => { online = true; ws.send(JSON.stringify({ type: 'hello', role: 'remote' })); renderPill(); };
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'state') { state = msg.state; render(); }
    else if (msg.type === 'presence') { tvs = msg.tvs; renderPill(); }
  };
  ws.onclose = () => { online = false; renderPill(); setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
}
function patch(p) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'patch', patch: p }));
  else toast('Not connected to the server', { err: true });
}
function cmd(action, extra) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(Object.assign({ type: 'cmd', action }, extra || {})));
}
connect();

// ======================================================================
//  header / status
// ======================================================================
$('#identBtn').innerHTML = ic('monitor');
$('#statusBtn').innerHTML = ic('gear');
$('#sheetClose').innerHTML = ic('x');
$('#wakeBtn').innerHTML = ic('power') + ' Turn the wall on';
$('#powerBtn').innerHTML = ic('power');
$('#playBtn').innerHTML = ic('pause') + 'Pause';
$('#muteBtn').innerHTML = ic('vol') + 'Mute';
$('#sleepBtn').innerHTML = ic('moon');
$('#identBtn').addEventListener('click', () => { buzz(); cmd('identify'); toast('Showing screen numbers on the TV'); });
$('#statusBtn').addEventListener('click', () => { buzz(); openSheet('status'); });
$('#wakeBtn').addEventListener('click', () => { buzz(15); patch({ power: true }); });

function renderPill() {
  const p = $('#pill'), t = $('#pillTxt');
  p.className = 'pill';
  if (!online) { p.classList.add('off'); t.textContent = 'Reconnecting'; return; }
  if (state && state.power === false) { p.classList.add('warn'); t.textContent = 'Standby'; return; }
  if (tvs === 0) { p.classList.add('warn'); t.textContent = 'No TV'; return; }
  p.classList.add('on'); t.textContent = 'On air';
}
function renderSleep() {
  const b = $('#sleepBanner');
  const left = state && state.sleepAt ? (state.sleepAt - Date.now()) / 1000 : 0;
  b.classList.toggle('show', left > 0);
  if (left > 0) $('#sleepTxt').innerHTML = ic('moon') + '&nbsp; Standby in ' + dur(left);
  const sb = $('#sleepBtn');
  sb.classList.toggle('sleeping', left > 0);
  sb.innerHTML = ic('moon');
  if (sheetMode === 'sleep' && sheet.classList.contains('open')) renderSheet();
}
$('#sleepCancel').addEventListener('click', () => { buzz(); patch({ sleepAt: null }); toast('Sleep timer cancelled'); });
setInterval(() => { if (state) renderSleep(); }, 15000);

// collapsible sections (remembered per phone)
const collapsed = LS.get('collapsed', {});
document.querySelectorAll('.sec').forEach(sec => {
  const h = sec.querySelector('[data-toggle]');
  if (!h) return;
  h.insertAdjacentHTML('beforeend', ic('chev', 'chev'));
  if (collapsed[sec.dataset.sec]) sec.classList.add('collapsed');
  h.addEventListener('click', () => {
    sec.classList.toggle('collapsed');
    collapsed[sec.dataset.sec] = sec.classList.contains('collapsed');
    LS.set('collapsed', collapsed);
  });
});

// ======================================================================
//  screens
// ======================================================================
let volDrag = false;
window.addEventListener('pointerup', () => { if (volDrag) { volDrag = false; render(); } });

function setVol(i, v) {
  v = Math.max(0, Math.min(100, Math.round(v)));
  if (v > 0) { lastVol[i] = v; LS.set('lastVol', lastVol); }
  patch({ slots: { [i]: { volume: v } } });
}

function render() {
  if (!state) return;
  renderPill();
  renderSleep();
  const off = state.power === false;
  $('#standbyHero').classList.toggle('show', off);

  if (!volDrag) {
    document.querySelectorAll('.lay').forEach(el => el.classList.toggle('active', el.dataset.layout === state.layout));
    renderSlots();
  }
  const pw = $('#powerBtn');
  pw.innerHTML = ic('power');
  pw.className = off ? 'offpw' : '';
  pw.title = off ? 'Turn on' : 'Standby';
  $('#playBtn').innerHTML = state.playing ? ic('pause') + 'Pause' : ic('play') + 'Play';
  const mb = $('#muteBtn');
  mb.innerHTML = state.muted ? ic('volx') + 'Unmute' : ic('vol') + 'Mute';
  mb.classList.toggle('warn', !!state.muted);
  syncWidgets(state.widgets);
  renderFree();
  if (sheet.classList.contains('open') && sheetMode === 'media') renderSheetExtra();
}

function renderSlots() {
  const slotsEl = $('#slots');
  slotsEl.className = 'layout-' + state.layout + (state.power === false ? ' dim' : '');
  const n = VISIBLE[state.layout] || 1;
  slotsEl.innerHTML = '';
  for (let i = 0; i < n; i++) slotsEl.appendChild(slotCard(i));
}

function slotCard(i) {
  const sl = state.slots[i];
  const s = sl.source;
  const card = document.createElement('div');
  if (!s) {
    card.className = 'slotcard empty';
    card.innerHTML = '<div class="plus">' + ic('plus') + '</div><b style="font-size:13px">Screen ' + (i + 1) + '</b><span style="font-size:12px">Tap to add something</span>';
    card.addEventListener('click', () => { buzz(); openSheet('media', i); });
    return card;
  }
  const k = srcKind(s.url);
  const vol = Number(sl.volume) || 0;
  const audible = vol > 0 && !state.muted;
  card.className = 'slotcard k-' + k + (audible ? ' audible' : '');
  const login = k === 'twitch' ? twitchLogin(s.url) : null;
  const live = login && followed.streams.find(f => f.login.toLowerCase() === login);
  let sub = '';
  if (live) sub = (live.game || 'Live') + ' · ' + Number(live.viewers).toLocaleString() + ' viewers';
  else if (k === 'file') sub = decodeURIComponent(s.url.replace(/^\/media\//, ''));
  else if (s.name !== s.url) sub = s.url.replace(/^https?:\/\/(www\.)?/, '');

  card.innerHTML =
    (live && live.thumb ? '<div class="bg" style="background-image:url(\'' + esc(live.thumb) + '?t=' + Math.floor(Date.now() / 120000) + '\')"></div>' : '') +
    '<div class="ctop"><span class="num">' + (i + 1) + '</span><span class="badge">' + KIND[k][0] + '</span>' +
      (live ? '<span class="livetag">LIVE</span>' : '') +
      (sl.paused ? '<span class="pausedtag">PAUSED</span>' : '') + '</div>' +
    '<div class="cname">' + esc(s.name || s.url) + '</div>' +
    (sub ? '<div class="csub">' + esc(sub) + '</div>' : '') +
    '<div class="volrow"><button class="mutebtn" title="Mute this screen">' + ic(vol > 0 ? 'vol' : 'volx') + '</button>' +
      '<input type="range" class="vol" min="0" max="100" value="' + vol + '" style="--p:' + vol + '%"><span class="vv">' + vol + '%</span></div>' +
    (k === 'twitch' ?
      '<div class="volrow"><select class="qual">' +
      [['best','Auto quality'],['1080p60','1080p60'],['936p60','936p60'],['720p60','720p60'],['720p','720p'],['480p','480p'],['360p','360p'],['160p','160p'],['audio_only','Audio only']]
        .map(q => '<option value="' + q[0] + '"' + ((sl.quality || 'best') === q[0] ? ' selected' : '') + '>' + q[1] + '</option>').join('') +
      '</select></div>' : '') +
    '<div class="crow">' +
      '<button class="iconbtn zl" title="Previous saved stream">' + ic('left') + '</button>' +
      '<button class="iconbtn zr" title="Next saved stream">' + ic('right') + '</button>' +
      '<button class="iconbtn pp' + (sl.paused ? ' on' : '') + '" title="Play / pause">' + ic(sl.paused ? 'play' : 'pause') + '</button>' +
      '<button class="iconbtn fit' + (sl.fit === 'cover' ? ' on' : '') + '" title="Fill screen (crop bars)">' + ic('fit') + '</button>' +
      '<button class="iconbtn aud" title="Solo — sound only here">' + ic('solo') + '</button>' +
      '<button class="iconbtn rel" title="Reload">' + ic('reload') + '</button>' +
      '<button class="iconbtn clr danger" title="Clear">' + ic('x') + '</button>' +
    '</div>';

  const stop = el => ['click', 'touchstart', 'pointerdown'].forEach(ev => el.addEventListener(ev, e => e.stopPropagation()));
  card.addEventListener('click', () => { buzz(); openSheet('media', i); });
  const on = (sel, fn) => { const el = card.querySelector(sel); if (el) el.addEventListener('click', e => { e.stopPropagation(); buzz(); fn(); }); };
  on('.zl', () => zap(i, -1));
  on('.zr', () => zap(i, 1));
  on('.pp', () => patch({ slots: { [i]: { paused: !sl.paused } } }));
  on('.fit', () => patch({ slots: { [i]: { fit: sl.fit === 'cover' ? 'contain' : 'cover' } } }));
  on('.aud', () => {
    const p = { muted: false, slots: {} };
    for (let j = 0; j < 4; j++) p.slots[j] = { volume: j === i ? (lastVol[i] || 100) : 0 };
    patch(p);
    toast('Sound only on screen ' + (i + 1));
  });
  on('.mutebtn', () => setVol(i, vol > 0 ? 0 : (lastVol[i] || 100)));
  on('.rel', () => { cmd('reload', { slot: i }); toast('Reloading screen ' + (i + 1)); });
  on('.clr', () => {
    const prev = JSON.parse(JSON.stringify(s));
    patch({ slots: { [i]: { source: null } } });
    toast('Screen ' + (i + 1) + ' cleared', { action: 'Undo', onAction: () => patch({ slots: { [i]: { source: prev } } }) });
  });
  const volEl = card.querySelector('.vol');
  stop(volEl);
  volEl.addEventListener('pointerdown', () => { volDrag = true; });
  volEl.addEventListener('input', () => {
    volEl.style.setProperty('--p', volEl.value + '%');
    volEl.nextElementSibling.textContent = volEl.value + '%';
    clearTimeout(volEl._t);
    volEl._t = setTimeout(() => setVol(i, Number(volEl.value)), 120);
  });
  const qual = card.querySelector('.qual');
  if (qual) {
    stop(qual);
    qual.addEventListener('change', () => {
      patch({ slots: { [i]: { quality: qual.value } } });
      toast('Switching to ' + qual.options[qual.selectedIndex].text);
    });
  }
  return card;
}

function zap(i, dir) {
  if (!streams.length) { toast('No saved streams to flip through'); return; }
  const cur = state.slots[i].source;
  let idx = cur ? streams.findIndex(s => s.url === cur.url) : (dir > 0 ? -1 : 0);
  idx = (idx + dir + streams.length) % streams.length;
  const s = streams[idx];
  patch({ slots: { [i]: { source: { type: 'stream', url: s.url, name: s.name } } } });
}

function swapSlots(a, b) {
  const A = state.slots[a], B = state.slots[b];
  const pick = s => ({ source: s.source || null, volume: Number(s.volume) || 0, quality: s.quality || 'best', fit: s.fit || 'contain', paused: !!s.paused });
  patch({ slots: { [a]: pick(B), [b]: pick(A) } });
  buzz(12);
  toast('Swapped screens ' + (a + 1) + ' and ' + (b + 1));
}

document.getElementById('layouts').addEventListener('click', e => {
  const lay = e.target.closest('.lay');
  if (lay) { buzz(); patch({ layout: lay.dataset.layout }); }
});
$('#powerBtn').addEventListener('click', () => {
  buzz(15);
  const turnOn = state.power === false;
  patch({ power: turnOn });
  if (!turnOn) toast('Wall in standby', { action: 'Undo', onAction: () => patch({ power: true }) });
});
$('#playBtn').addEventListener('click', () => { buzz(); patch({ playing: !state.playing }); });
$('#muteBtn').addEventListener('click', () => { buzz(); patch({ muted: !state.muted }); });
$('#sleepBtn').addEventListener('click', () => { buzz(); openSheet('sleep'); });

// ======================================================================
//  free layout editor
// ======================================================================
let rectsLocal = null, rectsDragging = false, rectsPushTimer = null;
function pushRects() {
  clearTimeout(rectsPushTimer);
  rectsPushTimer = setTimeout(() => patch({ rects: rectsLocal }), 150);
}
function renderFree() {
  const wrap = document.getElementById('freeWrap');
  const isFree = state.layout === 'free';
  wrap.style.display = isFree ? 'block' : 'none';
  if (!isFree || rectsDragging) return;
  const incoming = JSON.stringify(state.rects || []);
  if (incoming !== JSON.stringify(rectsLocal) || !document.getElementById('freeEditor').childElementCount) {
    rectsLocal = JSON.parse(incoming);
    buildFreeEditor();
  }
}
function buildFreeEditor() {
  const ed = document.getElementById('freeEditor');
  ed.innerHTML = '';
  (rectsLocal || []).forEach((r, i) => {
    const b = document.createElement('div');
    b.className = 'fbox' + (state.slots[i].source ? '' : ' nosrc');
    b.textContent = i + 1;
    const h = document.createElement('div');
    h.className = 'fh';
    b.appendChild(h);
    function apply() {
      b.style.left = r.x + '%'; b.style.top = r.y + '%';
      b.style.width = r.w + '%'; b.style.height = r.h + '%';
    }
    apply();
    let mode = null, sx, sy, o;
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      mode = e.target === h ? 'resize' : 'move';
      rectsDragging = true;
      sx = e.clientX; sy = e.clientY; o = { ...r };
      b.setPointerCapture(e.pointerId);
    });
    b.addEventListener('pointermove', e => {
      if (!mode) return;
      const er = ed.getBoundingClientRect();
      const dx = (e.clientX - sx) / er.width * 100;
      const dy = (e.clientY - sy) / er.height * 100;
      if (mode === 'move') {
        r.x = Math.round(Math.max(-80, Math.min(98, o.x + dx)));
        r.y = Math.round(Math.max(-80, Math.min(98, o.y + dy)));
      } else {
        r.w = Math.round(Math.max(10, Math.min(250, o.w + dx)));
        r.h = Math.round(Math.max(10, Math.min(250, o.h + dy)));
      }
      apply();
      pushRects();
    });
    const end = () => { mode = null; rectsDragging = false; pushRects(); };
    b.addEventListener('pointerup', end);
    b.addEventListener('pointercancel', end);
    ed.appendChild(b);
  });
}

// ======================================================================
//  bottom sheet (media picker / status / sleep)
// ======================================================================
const sheet = $('#sheet');
const overlay = $('#overlay');
function openSheet(mode, i) {
  sheetMode = mode;
  if (mode === 'media') {
    currentSlot = i;
    query = ''; tagFilter = null;
    $('#sheetTitle').textContent = 'Screen ' + (i + 1);
  } else {
    $('#sheetTitle').textContent = mode === 'status' ? 'System status' : 'Sleep timer';
  }
  overlay.classList.add('show');
  sheet.classList.add('open');
  renderSheetExtra();
  $('#sheetBody').innerHTML = '<div class="spin"></div>';
  if (mode === 'media') loadData().then(renderSheet);
  else renderSheet();
}
function closeSheet() { overlay.classList.remove('show'); sheet.classList.remove('open'); }
overlay.addEventListener('click', closeSheet);
$('#sheetClose').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

// swipe the sheet header down to close
(() => {
  const head = $('#sheetHead');
  let y0 = null;
  head.addEventListener('touchstart', e => { if (e.target.closest('button, input, select')) return; y0 = e.touches[0].clientY; sheet.classList.add('dragging'); }, { passive: true });
  head.addEventListener('touchmove', e => { if (y0 == null) return; const dy = e.touches[0].clientY - y0; sheet.style.transform = dy > 0 ? 'translateY(' + dy + 'px)' : ''; }, { passive: true });
  head.addEventListener('touchend', e => {
    if (y0 == null) return;
    const dy = e.changedTouches[0].clientY - y0;
    y0 = null; sheet.classList.remove('dragging'); sheet.style.transform = '';
    if (dy > 90) closeSheet();
  });
})();

function mediaTabs() {
  const t = [];
  if (followed.enabled) t.push(['live', 'Live']);
  t.push(['saved', 'Saved'], ['recent', 'Recent'], ['files', 'Files'], ['url', 'URL']);
  return t;
}

function renderSheetExtra() {
  const ex = $('#sheetExtra');
  if (sheetMode !== 'media') { ex.innerHTML = ''; return; }
  const tabs = mediaTabs();
  if (!tabs.find(t => t[0] === currentTab)) currentTab = 'saved';
  const n = VISIBLE[state.layout] || 1;
  let swap = '';
  if (n > 1) {
    swap = '<div class="swaprow">' + ic('swap') + ' Swap with';
    for (let j = 0; j < n; j++) if (j !== currentSlot) swap += '<button data-swap="' + j + '">' + (j + 1) + '</button>';
    swap += '</div>';
  }
  ex.innerHTML = swap +
    '<div class="tabs">' + tabs.map(t => '<button data-tab="' + t[0] + '"' + (t[0] === currentTab ? ' class="active"' : '') + '>' + t[1] +
      (t[0] === 'live' && followed.streams.length ? ' · ' + followed.streams.length : '') + '</button>').join('') + '</div>' +
    (['live', 'saved', 'recent', 'files'].includes(currentTab)
      ? '<div class="searchwrap">' + ic('search') + '<input type="text" id="sheetSearch" placeholder="Search…" value="' + esc(query) + '"></div>' : '');
  ex.querySelectorAll('[data-swap]').forEach(b => b.addEventListener('click', () => { swapSlots(currentSlot, Number(b.dataset.swap)); closeSheet(); }));
  ex.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    buzz(); currentTab = b.dataset.tab; LS.set('tab', currentTab); query = ''; tagFilter = null;
    renderSheetExtra(); renderSheet();
  }));
  const si = $('#sheetSearch');
  if (si) si.addEventListener('input', () => { query = si.value; renderSheet(); });
}

async function loadData() {
  const [s, l, r, f] = await Promise.all([
    api('/api/streams').catch(() => []),
    api('/api/library').catch(() => []),
    api('/api/recent').catch(() => []),
    api('/api/twitch/followed').catch(() => ({ enabled: false, streams: [] }))
  ]);
  streams = s; library = l; recent = r;
  followed = f && f.streams ? f : { enabled: false, streams: [] };
  if (sheet.classList.contains('open') && sheetMode === 'media') renderSheetExtra();
}

function setSource(source) {
  buzz(12);
  patch({ slots: { [currentSlot]: { source } } });
  closeSheet();
  toast('Playing on screen ' + (currentSlot + 1));
}
const matches = (...fields) => !query || fields.join(' ').toLowerCase().includes(query.toLowerCase());
const curUrl = () => state.slots[currentSlot] && state.slots[currentSlot].source && state.slots[currentSlot].source.url;

function itemEl(html, onClick, playing) {
  const it = document.createElement('div');
  it.className = 'item' + (playing ? ' playing' : '');
  it.innerHTML = html;
  if (onClick) it.addEventListener('click', onClick);
  return it;
}

function renderSheet() {
  const body = $('#sheetBody');
  body.innerHTML = '';
  if (sheetMode === 'status') return renderStatus(body);
  if (sheetMode === 'sleep') return renderSleepSheet(body);

  if (currentTab === 'live') {
    if (followed.error) body.innerHTML = '<div class="empty-list">' + esc(followed.error) + '</div>';
    const list = followed.streams.filter(f => matches(f.name, f.game, f.title));
    if (!followed.error && !list.length) body.innerHTML = '<div class="empty-list">' + (query ? 'No matches.' : 'Nobody you follow is live right now.') + '</div>';
    list.forEach(f => {
      const url = 'https://www.twitch.tv/' + f.login;
      const up = f.startedAt ? ' · ' + dur((Date.now() - Date.parse(f.startedAt)) / 1000) : '';
      body.appendChild(itemEl(
        '<div class="thumb" style="background-image:url(\'' + esc(f.thumb) + '\')"></div>' +
        '<div class="t"><b>' + esc(f.name) + '</b><small>' + esc(f.game || '') + ' · ' + Number(f.viewers).toLocaleString() + ' viewers' + up + '</small>' +
        (f.title ? '<small>' + esc(f.title) + '</small>' : '') + '</div>',
        () => setSource({ type: 'stream', url, name: f.name }), curUrl() === url));
    });
  } else if (currentTab === 'saved') {
    renderSaved(body);
  } else if (currentTab === 'recent') {
    const list = recent.filter(r => matches(r.name, r.url));
    if (!list.length) body.innerHTML = '<div class="empty-list">' + (query ? 'No matches.' : 'Nothing played yet.') + '</div>';
    list.forEach(r => {
      const saved = streams.some(s => s.url === r.url);
      const it = itemEl(icoHtml(r.url) + '<div class="t"><b>' + esc(r.name) + '</b><small>' + esc(KIND[srcKind(r.url)][0]) + ' · ' + ago(r.at) + '</small></div>' +
        (!saved && r.type !== 'file' ? '<div class="acts"><button class="sv" title="Save to streams">' + ic('plus') + '</button></div>' : ''),
        () => setSource({ type: r.type || 'stream', url: r.url, name: r.name }), curUrl() === r.url);
      const sv = it.querySelector('.sv');
      if (sv) sv.addEventListener('click', async e => {
        e.stopPropagation(); buzz();
        await postJson('/api/streams', { name: r.name, url: r.url, tags: [] });
        await loadData(); renderSheet(); toast('Saved "' + r.name + '"');
      });
      body.appendChild(it);
    });
    if (recent.length && !query) {
      const b = document.createElement('button');
      b.className = 'btn ghost'; b.style.marginTop = '8px'; b.textContent = 'Clear history';
      b.addEventListener('click', async () => { await api('/api/recent', { method: 'DELETE' }); recent = []; renderSheet(); toast('History cleared'); });
      body.appendChild(b);
    }
  } else if (currentTab === 'files') {
    const list = library.filter(f => matches(f.path));
    if (!list.length) body.innerHTML = '<div class="empty-list">' + (query ? 'No matches.' : 'No files in the media folder.') + '</div>';
    list.forEach(f => {
      const url = '/media/' + f.path.split('/').map(encodeURIComponent).join('/');
      const dir = f.path.includes('/') ? f.path.slice(0, f.path.lastIndexOf('/')) + ' · ' : '';
      body.appendChild(itemEl(icoHtml(url) + '<div class="t"><b>' + esc(f.name.replace(/\.[^.]+$/, '')) + '</b><small>' + esc(dir) + fmtSize(f.size) + '</small></div>',
        () => setSource({ type: 'file', url, name: f.name }), curUrl() === url));
    });
  } else {
    body.insertAdjacentHTML('beforeend',
      '<input type="url" id="oneUrl" placeholder="Paste a Twitch, YouTube or .m3u8 link">' +
      '<input type="text" id="oneName" placeholder="Name (optional)">' +
      '<div class="btnrow"><button class="btn" id="oneGo">' + ic('play') + 'Play</button>' +
      '<button class="btn ghost" id="oneSave">Play & save</button></div>' +
      '<div class="hint">Tip: you can also just type a Twitch channel name.</div>');
    const read = () => {
      let url = $('#oneUrl').value.trim();
      if (url && !/^https?:\/\//i.test(url) && /^\w{3,25}$/.test(url)) url = 'https://www.twitch.tv/' + url; // bare channel name
      return { url, name: $('#oneName').value.trim() || url.replace(/^https?:\/\/(www\.)?/, '') };
    };
    $('#oneGo').addEventListener('click', () => { const r = read(); if (r.url) setSource({ type: 'stream', url: r.url, name: r.name }); });
    $('#oneSave').addEventListener('click', async () => {
      const r = read(); if (!r.url) return;
      await postJson('/api/streams', { name: r.name, url: r.url, tags: [] });
      setSource({ type: 'stream', url: r.url, name: r.name });
    });
    navigator.clipboard && navigator.clipboard.readText && navigator.clipboard.readText().then(t => {
      if (t && /^https?:\/\//.test(t.trim()) && !$('#oneUrl').value) $('#oneUrl').value = t.trim();
    }).catch(() => {});
  }
}

function renderSaved(body) {
  const tags = [...new Set(streams.flatMap(s => s.tags || []))].sort();
  if (tags.length) {
    const chips = document.createElement('div');
    chips.className = 'tagchips';
    chips.innerHTML = '<button data-t=""' + (!tagFilter ? ' class="active"' : '') + '>All</button>' +
      tags.map(t => '<button data-t="' + esc(t) + '"' + (tagFilter === t ? ' class="active"' : '') + '>' + esc(t) + '</button>').join('');
    chips.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { buzz(); tagFilter = b.dataset.t || null; renderSheet(); }));
    body.appendChild(chips);
  }
  const list = streams.filter(s => (!tagFilter || (s.tags || []).includes(tagFilter)) && matches(s.name, s.url, (s.tags || []).join(' ')));
  if (!streams.length) body.insertAdjacentHTML('beforeend', '<div class="empty-list">No saved streams yet — add one below.</div>');
  else if (!list.length) body.insertAdjacentHTML('beforeend', '<div class="empty-list">No matches.</div>');
  list.forEach(s => {
    const login = twitchLogin(s.url);
    const live = login && followed.streams.find(f => f.login.toLowerCase() === login);
    const it = itemEl(icoHtml(s.url) +
      '<div class="t"><b>' + esc(s.name) + (live ? ' <span class="livetag" style="vertical-align:2px">LIVE</span>' : '') + '</b><small>' +
        esc((s.tags && s.tags.length ? s.tags.join(', ') + ' · ' : '') + s.url.replace(/^https?:\/\/(www\.)?/, '')) + '</small></div>' +
      '<div class="acts"><button class="ed" title="Edit">' + ic('edit') + '</button><button class="del" title="Delete">' + ic('trash') + '</button></div>',
      () => setSource({ type: 'stream', url: s.url, name: s.name }), curUrl() === s.url);
    it.querySelector('.del').addEventListener('click', async e => {
      e.stopPropagation(); buzz();
      await api('/api/streams/' + s.id, { method: 'DELETE' });
      await loadData(); renderSheet();
      toast('Deleted "' + s.name + '"', { action: 'Undo', onAction: async () => {
        await postJson('/api/streams', { name: s.name, url: s.url, tags: s.tags || [] });
        await loadData(); if (sheet.classList.contains('open')) renderSheet();
      } });
    });
    it.querySelector('.ed').addEventListener('click', e => {
      e.stopPropagation(); buzz();
      const f = document.createElement('div');
      f.className = 'editform';
      f.innerHTML = '<input type="text" class="en" value="' + esc(s.name) + '" placeholder="Name">' +
        '<input type="url" class="eu" value="' + esc(s.url) + '" placeholder="URL">' +
        '<input type="text" class="et" value="' + esc((s.tags || []).join(', ')) + '" placeholder="Tags, comma separated">' +
        '<div class="rowb"><button class="btn esave">Save</button><button class="btn ghost ecancel">Cancel</button></div>';
      it.replaceWith(f);
      f.querySelector('.en').focus();
      f.querySelector('.ecancel').addEventListener('click', () => renderSheet());
      f.querySelector('.esave').addEventListener('click', async () => {
        await postJson('/api/streams/' + s.id, {
          name: f.querySelector('.en').value, url: f.querySelector('.eu').value,
          tags: f.querySelector('.et').value.split(',').map(t => t.trim()).filter(Boolean)
        }, 'PUT');
        await loadData(); renderSheet(); toast('Saved');
      });
    });
    body.appendChild(it);
  });
  body.insertAdjacentHTML('beforeend',
    '<details class="add"' + (streams.length ? '' : ' open') + '><summary>' + ic('plus') + 'Add a stream</summary>' +
      '<input type="text" id="nsName" placeholder="Name (e.g. ESL CS)">' +
      '<input type="url" id="nsUrl" placeholder="https://… (Twitch, YouTube, .m3u8)">' +
      '<input type="text" id="nsTags" placeholder="Tags, comma separated (e.g. esports)">' +
      '<button class="btn" id="nsAdd">Save stream</button>' +
    '</details>');
  $('#nsAdd').addEventListener('click', async () => {
    const name = $('#nsName').value.trim();
    let url = $('#nsUrl').value.trim();
    const tags = $('#nsTags').value.split(',').map(t => t.trim()).filter(Boolean);
    if (!url) { toast('Enter a URL first', { err: true }); return; }
    if (!/^https?:\/\//i.test(url) && /^\w{3,25}$/.test(url)) url = 'https://www.twitch.tv/' + url;
    await postJson('/api/streams', { name, url, tags });
    await loadData(); renderSheet(); toast('Stream saved');
  });
}

function renderSleepSheet(body) {
  const left = state.sleepAt ? (state.sleepAt - Date.now()) / 1000 : 0;
  body.innerHTML =
    (left > 0 ? '<div class="bigsleep"><b>' + dur(left) + '</b><div>until standby</div></div>'
              : '<div class="hint" style="margin:6px 0 14px">The wall switches to standby automatically when the timer runs out — even if your phone is locked.</div>') +
    '<div class="chips">' +
      [[15, '15', 'min'], [30, '30', 'min'], [45, '45', 'min'], [60, '1', 'hour'], [90, '1.5', 'hours'], [120, '2', 'hours']]
        .map(c => '<button data-m="' + c[0] + '">' + c[1] + '<small>' + c[2] + '</small></button>').join('') +
    '</div>' +
    (left > 0 ? '<div class="btnrow" style="margin-top:12px"><button class="btn ghost" id="slAdd">+15 min</button><button class="btn danger" id="slOff">Turn off timer</button></div>' : '');
  body.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => {
    buzz(12);
    const m = Number(b.dataset.m);
    patch({ sleepAt: Date.now() + m * 60000 });
    if (state.power === false) patch({ power: true });
    toast('Standby in ' + dur(m * 60));
    closeSheet();
  }));
  const add = $('#slAdd');
  if (add) add.addEventListener('click', () => { buzz(); patch({ sleepAt: state.sleepAt + 15 * 60000 }); });
  const offb = $('#slOff');
  if (offb) offb.addEventListener('click', () => { buzz(); patch({ sleepAt: null }); toast('Sleep timer off'); closeSheet(); });
}

function fmtSize(b) {
  if (!b) return '';
  const u = ['B', 'KB', 'MB', 'GB']; let i = 0;
  while (b >= 1024 && i < 3) { b /= 1024; i++; }
  return b.toFixed(i ? 1 : 0) + ' ' + u[i];
}

// refresh followed-live list every minute while the remote is visible
setInterval(() => {
  if (document.visibilityState !== 'visible' || !followed.enabled) return;
  api('/api/twitch/followed').then(f => { if (f && f.streams) { followed = f; if (state && !volDrag) renderSlots(); } }).catch(() => {});
}, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadData().then(() => state && renderSlots()); });

// ======================================================================
//  widgets editor
// ======================================================================
let widgetsLocal = [];
let pushTimer = null;
function uid() { return Math.random().toString(36).slice(2, 10); }
function pushWidgets(immediate) {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => patch({ widgets: widgetsLocal }), immediate ? 0 : 300);
}
function syncWidgets(ws) {
  const incoming = JSON.stringify(ws || []);
  if (incoming === JSON.stringify(widgetsLocal)) return;
  widgetsLocal = JSON.parse(incoming);
  renderWidgetsUI();
}

document.querySelectorAll('.addrow button').forEach(b => b.addEventListener('click', () => {
  buzz();
  const type = b.dataset.add;
  const data = type === 'text' ? { title: '', body: 'New text' } :
               type === 'score' ? { teamA: 'Team A', scoreA: 0, teamB: 'Team B', scoreB: 0 } :
               type === 'custom' ? { title: '', url: '', interval: 30, template: '' } :
               type.slice(0, 2) === 'cs' ? { slug: '', name: '', interval: 30 } :
               type.slice(0, 2) === 'ps' ? { interval: 60 } : {};
  widgetsLocal.push({ id: uid(), type, x: 50, y: type === 'clock' ? 8 : 80, data });
  renderWidgetsUI();
  pushWidgets(true);
}));

function renderWidgetsUI() {
  const list = document.getElementById('widgetList');
  $('#wCount').textContent = widgetsLocal.length;
  list.innerHTML = '';
  if (!widgetsLocal.length) {
    list.innerHTML = '<div class="empty-list" style="padding:8px 0 4px">No widgets on the wall — add one below.</div>';
    return;
  }
  widgetsLocal.forEach(w => {
    const card = document.createElement('div');
    card.className = 'wcard';
    const label = { text: 'TEXT', score: 'SCOREBOARD', clock: 'CLOCK', custom: 'CUSTOM DATA',
                    csplayer: 'CS PLAYER', csplayerlive: 'CS PLAYER — LIVE MATCH',
                    csteam: 'CS TEAM', csmatch: 'CS MATCH',
                    pslive: 'PS LIVE SCOREBOARD', psticker: 'PS UPCOMING MATCHES', pstournament: 'PS TOURNAMENTS' }[w.type] || w.type;
    let fields = '';
    if (w.type === 'csplayer' || w.type === 'csteam' || w.type === 'csmatch' || w.type === 'csplayerlive') {
      const ph = w.type === 'csplayer' || w.type === 'csplayerlive' ? 'Exact nickname (e.g. s1mple, donk)' :
                 w.type === 'csteam' ? 'Team slug (e.g. natus-vincere, vitality)' :
                 'Team name filter — empty shows all live/upcoming';
      fields =
        '<div class="hint" style="margin:0 0 6px">' + (w.data.slug ? '&#10003; ' + esc(w.data.name) : 'Nothing selected yet') + '</div>' +
        '<div class="scorerow"><input type="text" class="csq" placeholder="' + ph + '">' +
        '<button class="sbtn csgo">' + ic('search') + '</button></div>' +
        '<div class="csres"></div>' +
        '<input type="text" data-f="interval" placeholder="Refresh seconds (default 30)" value="' + esc(String(w.data.interval || '')) + '">';
    } else if (w.type === 'custom') {
      fields = '<input type="text" data-f="title" placeholder="Title (e.g. s1mple stats)" value="' + esc(w.data.title || '') + '">' +
               '<input type="url" data-f="url" placeholder="Data URL (returns JSON)" value="' + esc(w.data.url || '') + '">' +
               '<input type="text" data-f="interval" placeholder="Refresh seconds (default 30)" value="' + esc(String(w.data.interval || '')) + '">' +
               '<textarea data-f="template" rows="3" placeholder="Template, e.g.&#10;Rating: {{stats.rating}}&#10;K/D: {{stats.kd}}">' + esc(w.data.template || '') + '</textarea>' +
               '<div class="hint">The TV fetches the URL every N seconds (via the server, so no CORS issues). Use {{path.to.field}} to insert JSON fields, {{items[0].name}} for arrays, {{.}} for the whole response.</div>';
    } else if (w.type === 'text') {
      fields = '<input type="text" data-f="title" placeholder="Title (optional)" value="' + esc(w.data.title || '') + '">' +
               '<textarea data-f="body" rows="2" placeholder="Text…">' + esc(w.data.body || '') + '</textarea>';
    } else if (w.type === 'score') {
      fields =
        '<div class="scorerow"><input type="text" data-f="teamA" value="' + esc(w.data.teamA || '') + '">' +
          '<button class="sbtn" data-s="scoreA" data-d="-1">&#8722;</button>' +
          '<span class="sval">' + (w.data.scoreA || 0) + '</span>' +
          '<button class="sbtn" data-s="scoreA" data-d="1">+</button></div>' +
        '<div class="scorerow"><input type="text" data-f="teamB" value="' + esc(w.data.teamB || '') + '">' +
          '<button class="sbtn" data-s="scoreB" data-d="-1">&#8722;</button>' +
          '<span class="sval">' + (w.data.scoreB || 0) + '</span>' +
          '<button class="sbtn" data-s="scoreB" data-d="1">+</button></div>';
    } else if (w.type === 'pslive' || w.type === 'psticker' || w.type === 'pstournament') {
      const desc = w.type === 'pslive' ? 'Shows live CS2 match scores from PandaScore.' :
                   w.type === 'psticker' ? 'Lists upcoming CS2 matches.' :
                   'Shows currently active CS2 tournaments.';
      fields = '<div class="hint" style="margin:0 0 8px">' + desc + '</div>' +
               '<input type="text" data-f="interval" placeholder="Refresh seconds (default 60)" value="' + esc(String(w.data.interval || '')) + '">' +
               '<div class="hint">Requires PANDASCORE_TOKEN set in docker-compose.yml.</div>';
    } else {
      fields = '<div class="hint" style="margin:8px 0">Shows the current time.</div>';
    }
    card.innerHTML =
      '<div class="whead"><span>' + label + '</span><button class="del" title="Remove">' + ic('trash') + '</button></div>' +
      '<div class="wbody"><div class="wfields">' + fields + '</div>' +
      '<div><div class="pad"><div class="dot"></div></div><div class="padlbl">drag to position</div></div></div>';

    card.querySelector('.del').addEventListener('click', () => {
      buzz();
      const removed = JSON.parse(JSON.stringify(w));
      const idx = widgetsLocal.findIndex(x => x.id === w.id);
      widgetsLocal = widgetsLocal.filter(x => x.id !== w.id);
      renderWidgetsUI();
      pushWidgets(true);
      toast('Widget removed', { action: 'Undo', onAction: () => {
        widgetsLocal.splice(Math.min(idx, widgetsLocal.length), 0, removed);
        renderWidgetsUI(); pushWidgets(true);
      } });
    });
    card.querySelectorAll('[data-f]').forEach(inp => inp.addEventListener('input', () => {
      w.data[inp.dataset.f] = inp.value;
      pushWidgets();
    }));
    card.querySelectorAll('.sbtn[data-s]').forEach(btn => btn.addEventListener('click', () => {
      buzz();
      const k = btn.dataset.s;
      w.data[k] = Math.max(0, (Number(w.data[k]) || 0) + Number(btn.dataset.d));
      btn.parentElement.querySelector('.sval').textContent = w.data[k];
      pushWidgets(true);
    }));
    const csgo = card.querySelector('.csgo');
    if (csgo) {
      const doSearch = async () => {
        const q = card.querySelector('.csq').value.trim();
        const resEl = card.querySelector('.csres');
        const type = (w.type === 'csplayer' || w.type === 'csplayerlive') ? 'player' :
                     w.type === 'csteam' ? 'team' : 'match';
        if (type !== 'match' && !q) { resEl.innerHTML = '<div class="hint">Type a name first.</div>'; return; }
        resEl.innerHTML = '<div class="spin" style="margin:8px auto"></div>';
        try {
          const list = await fetch('/api/cs/search?type=' + type + '&q=' + encodeURIComponent(q)).then(r => r.json());
          if (list.error) { resEl.innerHTML = '<div class="hint">&#9888; ' + esc(list.error) + '</div>'; return; }
          if (!Array.isArray(list) || !list.length) {
            resEl.innerHTML = '<div class="hint">No results — ' +
              (type === 'player' ? 'use the exact nickname.' : type === 'team' ? 'use the team slug, e.g. natus-vincere.' : 'no live/upcoming matches found.') + '</div>';
            return;
          }
          resEl.innerHTML = '';
          list.forEach(it => {
            const o = document.createElement('div');
            o.className = 'item';
            o.innerHTML = '<div class="t"><b>' + esc(it.name) + '</b><small>' + esc(it.sub || '') + '</small></div>';
            o.addEventListener('click', () => {
              w.data.slug = it.slug;
              w.data.name = it.name;
              pushWidgets(true);
              renderWidgetsUI();
            });
            resEl.appendChild(o);
          });
        } catch {
          resEl.innerHTML = '<div class="hint">Search failed — is the server online?</div>';
        }
      };
      csgo.addEventListener('click', doSearch);
      card.querySelector('.csq').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
    }
    bindPad(card.querySelector('.pad'), w);
    list.appendChild(card);
  });
}

function bindPad(pad, w) {
  const dot = pad.querySelector('.dot');
  function setDot() { dot.style.left = (w.x || 50) + '%'; dot.style.top = (w.y || 50) + '%'; }
  setDot();
  function move(e) {
    const r = pad.getBoundingClientRect();
    w.x = Math.round(Math.max(2, Math.min(98, (e.clientX - r.left) / r.width * 100)));
    w.y = Math.round(Math.max(2, Math.min(98, (e.clientY - r.top) / r.height * 100)));
    setDot();
    pushWidgets();
  }
  pad.addEventListener('pointerdown', e => { pad.setPointerCapture(e.pointerId); move(e); });
  pad.addEventListener('pointermove', e => { if (e.buttons) move(e); });
}

// ======================================================================
//  presets
// ======================================================================
let presets = [];
async function loadPresets() {
  presets = await api('/api/presets').catch(() => []);
  renderPresets();
}
function renderPresets() {
  const list = document.getElementById('presetList');
  $('#pCount').textContent = presets.length;
  list.innerHTML = '';
  if (!presets.length) {
    list.innerHTML = '<div class="empty-list" style="padding:8px 0 12px">Set up the wall the way you like, then save it here for one-tap recall.</div>';
    return;
  }
  const grid = document.createElement('div');
  grid.className = 'presets';
  presets.forEach(p => {
    const el = document.createElement('div');
    el.className = 'preset';
    el.innerHTML = '<b>' + esc(p.name) + '</b><button class="del" title="Delete">' + ic('x') + '</button>';
    el.addEventListener('click', async () => {
      buzz(12);
      await fetch('/api/presets/' + p.id + '/apply', { method: 'POST' });
      toast('Loaded "' + p.name + '"');
    });
    el.querySelector('.del').addEventListener('click', async e => {
      e.stopPropagation();
      if (!confirm('Delete preset "' + p.name + '"?')) return;
      await fetch('/api/presets/' + p.id, { method: 'DELETE' });
      loadPresets();
    });
    grid.appendChild(el);
  });
  list.appendChild(grid);
}
async function savePreset() {
  const inp = document.getElementById('presetName');
  const name = inp.value.trim();
  if (!name) { inp.focus(); return; }
  buzz();
  await postJson('/api/presets', { name });
  inp.value = '';
  loadPresets();
  toast('Preset "' + name + '" saved');
}
$('#presetSave').addEventListener('click', savePreset);
$('#presetName').addEventListener('keydown', e => { if (e.key === 'Enter') savePreset(); });

loadPresets();
loadData(); // streams for zapping + followed-live info on cards
</script>
